services:
  # Docker Compose will refer to this service as "bpe-tokenizer"
  bpe-tokenizer:

    # Tell Docker Compose to build an image
    build:

      # Use the current project folder as the Docker build context
      context: .

      # Tell Compose which Dockerfile to use
      dockerfile: Dockerfile

    # Name/tag the built Docker image
    image: bpe-tokenizer:latest

    # Give the running container a fixed name
    container_name: bpe-tokenizer

    # Restart automatically unless manually stopped
    restart: unless-stopped

    environment:
      ARTIFACTS_DIR: /app/artifacts
      FRONTEND_DIST_DIR: /app/frontend/dist
      PORT: 8001

    ports:
      - "8001:8001"